<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastilicious | Simple. Flavorful. Satisfying.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- PyScript (loads Python in the browser) -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>

  <!-- Reusable pastil drawing used by the menu cards -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="pastil-base" viewBox="0 0 120 100">
      <rect x="2" y="30" width="116" height="64" rx="12" fill="#1b5e3a"/>
      <rect x="7" y="35" width="106" height="54" rx="9" fill="#3a9560"/>
      <line x1="10" y1="62" x2="110" y2="62" stroke="#2a7b4b" stroke-width="2"/>
      <path d="M22 76 Q20 46 60 44 Q100 46 98 76 Q96 88 60 88 Q24 88 22 76Z" fill="#fffdf4"/>
      <path d="M38 68 Q36 52 60 50 Q84 52 82 68 Q80 76 60 76 Q40 76 38 68Z" fill="#b8681f"/>
      <g fill="none" stroke-linecap="round" stroke-width="3">
        <path d="M44 66 Q54 56 64 64 T78 60" stroke="#e0963f"/>
        <path d="M46 72 Q58 66 70 72" stroke="#8a4513"/>
      </g>
    </symbol>
  </svg>

  <!-- 1. NAVIGATION BAR -->
  <header class="navbar">
    <a href="#home" class="logo">PASTILICIOUS</a>
    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#menu">Menu</a>
      <a href="#order">Order</a>
      <a href="#feedback">Feedback</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- 2. HERO -->
    <section id="home" class="hero">
      <div class="hero-text">
        <h1>PASTILICIOUS</h1>
        <p class="tagline">"Simple. Flavorful. Satisfying."</p>
        <p>Enjoy delicious chicken pastil served with rice, prepared for anyone looking for a simple and satisfying meal.</p>
        <div class="hero-buttons">
          <button id="view-menu-btn" class="btn btn-primary">View Menu</button>
          <button id="order-now-btn" class="btn btn-accent">Order Now</button>
        </div>
      </div>
      <div class="hero-image" aria-hidden="true">
        <!-- Pastil illustration: rice and shredded chicken on a banana leaf -->
        <svg class="pastil-art" viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" role="img">
          <!-- steam -->
          <g fill="none" stroke="#9bcfae" stroke-width="5" stroke-linecap="round">
            <path d="M125 85 Q112 65 125 48 Q138 31 125 14"/>
            <path d="M170 80 Q157 58 170 40 Q183 22 170 4"/>
            <path d="M215 85 Q202 65 215 48 Q228 31 215 14"/>
          </g>
          <!-- banana leaf -->
          <rect x="20" y="105" width="300" height="170" rx="30" fill="#1b5e3a"/>
          <rect x="34" y="118" width="272" height="144" rx="22" fill="#3a9560"/>
          <g stroke="#2a7b4b" stroke-width="3" stroke-linecap="round">
            <line x1="50" y1="190" x2="290" y2="190"/>
            <line x1="60" y1="135" x2="95" y2="190"/><line x1="130" y1="125" x2="150" y2="190"/>
            <line x1="210" y1="125" x2="190" y2="190"/><line x1="280" y1="135" x2="245" y2="190"/>
            <line x1="60" y1="245" x2="95" y2="190"/><line x1="130" y1="255" x2="150" y2="190"/>
            <line x1="210" y1="255" x2="190" y2="190"/><line x1="280" y1="245" x2="245" y2="190"/>
          </g>
          <!-- rice -->
          <path d="M75 205 Q70 135 170 130 Q270 135 265 205 Q262 240 170 240 Q78 240 75 205Z" fill="#fffdf4" stroke="#e8e2cc" stroke-width="3"/>
          <g fill="#f1ead2">
            <ellipse cx="105" cy="205" rx="7" ry="3" transform="rotate(-20 105 205)"/>
            <ellipse cx="130" cy="225" rx="7" ry="3" transform="rotate(15 130 225)"/>
            <ellipse cx="215" cy="228" rx="7" ry="3" transform="rotate(-15 215 228)"/>
            <ellipse cx="240" cy="205" rx="7" ry="3" transform="rotate(25 240 205)"/>
            <ellipse cx="170" cy="232" rx="7" ry="3"/>
          </g>
          <!-- shredded chicken -->
          <path d="M110 190 Q105 145 170 142 Q235 145 230 190 Q225 212 170 212 Q115 212 110 190Z" fill="#b8681f"/>
          <g fill="none" stroke-linecap="round" stroke-width="5">
            <path d="M125 185 Q145 165 165 180 T205 170" stroke="#8a4513"/>
            <path d="M130 170 Q155 155 175 168 T218 165" stroke="#e0963f"/>
            <path d="M120 198 Q150 185 172 197 T222 190" stroke="#e0963f"/>
            <path d="M140 155 Q165 148 190 158" stroke="#8a4513"/>
            <path d="M150 205 Q175 195 200 205" stroke="#8a4513"/>
          </g>
          <!-- chili -->
          <path d="M215 150 Q240 140 252 160 Q238 156 222 162Z" fill="#d93a2b"/>
          <path d="M215 150 Q212 143 218 140" fill="none" stroke="#2a7b4b" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="plate-label">Our signature chicken pastil</span>
      </div>
    </section>
</body>
</html>
